[package]
name = "templess"
version = "0.1.0"
edition = "2024"

[features]
bundle-clingo = []

[dependencies]
rusqlite = { version = "0.38.0", features = ["bundled"] }
serde = {version = "1.0.228", features = ["derive"]}
serde_json = "1.0.149"
strum = {version = "0.27.2", features = ["derive"]}
toml = "0.9.11"
bitflags = "2.10.0"
anyhow = "1.0.100"
tokio = { version = "1.49.0", features = ["full"] }
axum = { version = "0.8.8", features = ["ws", "macros"] }
futures-util = "0.3.32"
dashmap = "6.1.0"
thiserror = "2.0.18"
tower-http = { version = "0.6.8", features = ["cors"] }
itertools = "0.14.0"

[build-dependencies]
bindgen = "0.72.1"
cmake = "0.1.57"
